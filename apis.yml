aid: neurelis
name: Neurelis
description: 'Neurelis, Inc. is a privately held San Diego neuroscience and specialty
  pharmaceutical company founded in 2007 that licenses, develops and commercializes
  therapies for epilepsy, psychiatry and other central nervous system disorders with
  high unmet need. Its lead commercial product is VALTOCO (diazepam nasal spray), an
  FDA-approved acute treatment for intermittent, stereotypic episodes of frequent seizure
  activity (seizure clusters) in adult and pediatric patients two years of age and older,
  built on Intravail transmucosal absorption-enhancement technology acquired with Aegis
  Therapeutics. Neurelis also holds the ProTek and Hydrogel drug-delivery platforms,
  licenses Intravail to partners such as ARS Pharmaceuticals and Dr. Reddy''s/Upsher-Smith,
  and is advancing the NRL-1049 and NRL-1004 pipeline programs. Neurelis publishes no
  developer program, no public API and no machine-readable API contract; its only
  agent-facing machine-readable surface is a set of llms.txt documents served on its
  corporate, product and patient-support properties.'
